<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <title>Restaurants</title>
</head>
<body>
    <header>
        <!-- Creates links to other pages -->
        <a href="index.html">Restaurants</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="profile.html" id="profile-link" hidden>Profile</a>
    </header>

    <main>
        <h1>Restaurants</h1>

        <!-- Allows users to choose how restaurants are sorted. -->
        <label for="sort">Sort by: </label>
        <select id="sort">
            <option value="name">Alphabetical</option>
            <option value="distance">Nearest to me</option>
        </select>

        <!-- Shows leaflet map -->
        <div id="map" hidden></div>

        <!-- Shows all restaurants using API. -->
        <section id="restaurant-list">

        </section>
    </main>
    <!-- Exports script from "restaurant.js" -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="../js/restaurant.js"></script>
    <script src="../js/header.js" defer></script>
</body>
</html>
