<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Sign in</title>
</head>
<body>
    <header>
        <!-- Creates links to other pages -->
        <a href="index.html">Restaurants</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="profile.html" id="profile-link" hidden>Profile</a>
    </header>

    <main>
        <h1>Log in</h1>

        <!-- Creates a login form with fields 'username' and 'password' that allows user to log in system -->
        <form id="login-form">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <!-- Submits form for further processing. -->
            <button type="submit">Login</button>

            <!-- Shows the user whether they have logged in or not. -->
            <p id="login-message"></p>
        </form>

        <!-- Links to the register page . -->
        <p>Don't have an account? <a href="register.html">Register</a></p>
    </main>

    <!-- Exports script from "login.js" -->
    <script src="../js/login.js" defer></script>
    <script src="../js/header.js" defer></script>
</body>
</html>
