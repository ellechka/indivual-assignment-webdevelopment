<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Sign up</title>
</head>
<body>
    <header>
        <a href="index.html">Restaurants</a>
        <a href="login.html">Login</a>
    </header>

    <main>
        <h1>Create an account</h1>

        <!-- Creates a register form with fields 'username', 'email' and 'password' that allows user to create an account -->
        <form id="register-form">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
            <p id="username-message"></p>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required>

            <!-- Submits form for further processing. -->
            <button type="submit">Register</button>

            <!-- Shows the user whether they have registered an account or not. -->
            <p id="register-message"></p>
        </form>

        <!-- Links to the login page . -->
        <p>Already have an account? <a href="login.html">Login</a></p>
    </main>

    <!-- Exports script from "register.js" -->
    <script type='module' src="../js/register.js" defer></script>
</body>
</html>
